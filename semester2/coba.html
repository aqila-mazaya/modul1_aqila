<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body id="body">
  <button onclick="berubah()">ubah</button>
  <button onclick="berubah2()">ubah</button>
  <p onmouseenter="berubah()"onmouseleave="berubah2()">berubah</p> 
  <script>
    body = document.getElementById("body")
    function berubah(){
        body.style.backgroundColor="lightpink"
    }
    function berubah2(){
        body.style.backgroundColor="lightyellow"
    }
       
  </script> 
</body>
</html>
